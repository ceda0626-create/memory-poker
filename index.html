<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記憶撲克</title><style> *{box-sizing:border-box}body{background:#102e29;color:#fff;font:16px system-ui;margin:0}main{max-width:480px;margin:auto;padding:20px}h1{color:#f4d69a}button,input{font:inherit;border:0;border-radius:10px;padding:12px;margin:5px 0}button{background:#f4d69a;color:#18342e;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}input{width:100%}.wide{width:100%}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{height:83px;background:#fff;color:#17251e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;border:3px solid transparent;border-radius:9px;margin:0}.back{background:#28574d;color:#fff;border:2px solid #6d9988}.red{color:#bd2639}.selected{border:3px solid #ffc34e;background:#fff0b8;color:#17251e}.card small{font-size:12px}#public{display:flex;gap:10px;justify-content:center;margin:12px 0}#public .card{width:70px}#status{font-size:20px;font-weight:bold;margin:15px 0}#info{color:#d2e4d9}#error{color:#ffb4a9;overflow-wrap:anywhere}</style><main><h1>♠ 記憶撲克</h1><div id="lobby"><button class="wide" onclick="act('create')">建立房間</button><input id="code" placeholder="輸入房間代碼"><button class="wide" onclick="act('join')">加入好友</button></div><div id="game" hidden><div id="info"></div><button id="share" onclick="share()">複製邀請連結</button><div id="status"></div><div id="public"></div><div id="grid"></div><button id="confirm" class="wide" hidden></button><div id="result"></div></div><p id="error"></p></main><script>
let room=new URLSearchParams(location.search).get('room')||'',player=sessionStorage.getItem('p:'+room)||'',state,sel=[],busy=false;const $=x=>document.getElementById(x);$('code').value=room;const names=['高牌','一對','兩對','三條','順子','同花','葫蘆','四條','同花順'];function face(c){return (c[0]>10?['J','Q','K','A'][c[0]-11]:c[0])+c[1]}function card(c,i,click){let b=document.createElement('button');b.className='card '+(!c?'back ':('♥♦'.includes(c[1])?'red ':''))+(sel.includes(i)&&click?'selected':'');b.textContent=c?face(c):'◆';if(i>=0){let n=document.createElement('small');n.textContent=i+1;b.append(n)}if(click)b.onclick=()=>{if(sel.includes(i))sel=sel.filter(x=>x!==i);else if(sel.length<2)sel.push(i);render()};else b.disabled=true;return b}
async function act(op){if(busy)return;busy=true;try{let res=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,room:op==='join'?$('code').value.trim():room,player,picks:sel})});let d=await res.json();if(d.error)throw Error(d.error);if(!state||state.round!==d.round)sel=[];state=d;room=d.room;player=d.player;sessionStorage.setItem('p:'+room,player);$('error').textContent='';render()}catch(e){$('error').textContent=e.message}finally{busy=false}}
function render(){let s=state;if(!s)return;$('lobby').hidden=true;$('game').hidden=false;$('info').textContent=`房間 ${room}｜玩家 ${s.seat+1}｜第 ${s.round} 局｜比分 ${s.wins.join(' : ')}`;$('status').textContent=({waiting:'等待好友加入',prepare:'準備開始 '+Math.ceil(s.prepare),memory:'記憶時間 '+Math.ceil(s.remaining)+' 秒',choose:s.own?'已確認，等待對手':'選擇兩張牌',result:s.winner===-1?'平手！':s.winner===s.seat?'你贏了！':'好友獲勝！'})[s.phase];$('grid').replaceChildren();$('public').replaceChildren();$('result').textContent='';if(s.public)s.public.forEach(c=>$('public').append(card(c,-1,false)));if(['memory','choose','result'].includes(s.phase))for(let i=0;i<16;i++)$('grid').append(card(s.deck?.[i],i,s.phase==='choose'&&!s.own));let b=$('confirm');b.hidden=!(s.phase==='choose'&&!s.own||s.phase==='result');b.disabled=s.phase==='choose'?sel.length!==2:s.ready;b.textContent=s.phase==='choose'?'確認選牌 '+sel.length+'/2':s.ready?'等待好友準備':'下一局';b.onclick=()=>act(s.phase==='choose'?'pick':'next');if(s.phase==='result')$('result').textContent=s.picks.map((p,i)=>`玩家 ${i+1}：${p.map(j=>face(s.deck[j])).join('、')} — ${s.scores[i][0]===8&&s.scores[i][1]===14?'皇家同花順':names[s.scores[i][0]]}`).join('\n');$('result').style.whiteSpace='pre-line'}
async function share(){let u=new URL(location.href);u.search='?room='+room;try{await navigator.clipboard.writeText(u.href);$('share').textContent='已複製邀請連結'}catch{prompt('複製邀請連結',u.href)}}if(room&&player)act('state');setInterval(()=>{if(state)act('state')},350);
</script></html>
